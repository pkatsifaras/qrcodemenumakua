<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Makua Therma Ikaria</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
            position: relative;
        }

        .title {
            font-size: 48px;
            color: #FFC107;
            margin-bottom: 40px;
        }

        .logo img {
            width: 50%;
            margin-bottom: 100px;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            position: relative;
            justify-content: space-between;
        }

        .image-box-left {
            position: relative;
            width: 40%;
            z-index: 2;
            top: 80px;
        }

        .image-box-left::before {
            content: '';
            position: absolute;
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            left: -30px;
            top: -30px;
            z-index: -1;
        }

        .image-box-left img {
            width: 100%;
            display: block;
        }

        .image-box-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 35%;
        }

        .image-box-right::before {
            content: '';
            position: absolute;
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            left: -30px;
            top: -30px;
            z-index: -1;
        }

        .image-box-right img {
            width: 100%;
            display: block;
        }

        .text-box {
            margin-top: 40px;
            max-width: 600px;
            margin-left: auto;
            font-size: 16px;
            line-height: 1.8;
        }

        .learn-more {
            margin-top: 20px;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid white;
            display: inline-block;
            padding-bottom: 4px;
            cursor: pointer;
        }

        @media screen and (max-width: 768px) {
            .content {
                flex-direction: column;
                align-items: center;
            }

            .logo img {
                width: 80%;
                margin-bottom: 50px;
            }

            .image-box-left,
            .image-box-right {
                position: relative !important;
                width: 100% !important;
                top: 0 !important;
            }

            .image-box-right {
                margin-top: 40px;
            }

            .text-box {
                margin-left: 0;
                margin-top: 40px;
                text-align: center;
            }
        }

    </style>
</head>
<body>
<div class="wrapper">
    <div class="logo">
        <img src="/images/makua_logo_black.png" alt="makua logo">
    </div>

    <div class="content">
        <div class="image-box-left">
            <img src="/images/makua-intro-1.png" alt="Karate 1">
        </div>

        <div class="image-box-right">
            <img src="/images/makua-intro-2.png" alt="Karate 2">
        </div>
    </div>

    <div class="text-box">
        <p>Θέρμα Ικαρία - Therma Ikaria</p>
        <p>Εστιατόριο για πρωινό και brunch
            #alldaybar #cafe #restaurant #breakfast #brunch #lunch #dinner #ikaria #ikariagram #ikariaisland #thermaikarias</p>
        <div class="learn-more"><a href="https://maps.app.goo.gl/rp4smZ5dVmhK2MJr7" target="_blank">View Map</a></div>
        <div class="learn-more menu-link"><a href="/qrmenu/intro.html" >Menu</a></div>
    </div>
</div>
</body>
</html>
